function ranks(data,currency=true){if(!data.length)return empty();const max=Math.max(...data.map(r=>Math.abs(r.value)),1);return `<div class="rank-list chart-interactive">${data.slice(0,5).map((r,i)=>`<div class="rank-row" ${chartAttrs(r.name,currency?money(r.value):integer(r.value))}><div class="rank-head"><span><small class="rank-number">${String(i+1).padStart(2,'0')}</small>${esc(r.name)}</span><strong>${esc(currency?shortMoney(r.value):integer(r.value))}</strong></div><div class="track"><i style="width:${Math.abs(r.value)/max*100}%;animation-delay:${i*55}ms"></i></div></div>`).join('')}${chartTip()}</div>`}
function hideChartTips(){document.querySelectorAll('.chart-tooltip').forEach(tip=>{tip.hidden=true});document.querySelectorAll('.is-chart-active').forEach(node=>node.classList.remove('is-chart-active'))}
function showChartTip(target){
 if(!target)return;const wrap=target.closest('.chart-interactive'),tip=wrap&&wrap.querySelector('.chart-tooltip');if(!tip)return;
 hideChartTips();target.classList.add('is-chart-active');
 tip.querySelector('span').textContent=target.dataset.chartLabel;tip.querySelector('strong').textContent=target.dataset.chartValue;tip.hidden=false;
 const rect=wrap.getBoundingClientRect(),anchor=(target.querySelector('.chart-dot')||target).getBoundingClientRect();
 tip.style.left=Math.max(0,Math.min(rect.width-tip.offsetWidth,(anchor.left+anchor.right)/2-rect.left-tip.offsetWidth/2))+'px';
 tip.style.top=Math.max(0,Math.min(rect.height-tip.offsetHeight,anchor.top-rect.top-tip.offsetHeight-12))+'px';
}
function renderNav(){let last='';$('navigation').innerHTML=menus.map(m=>{const title=last!==m.group?`<p class="nav-label">${esc(m.group)}</p>`:'';last=m.group;return `${title}<button class="nav-item" data-view="${m.id}" aria-current="${m.id===state.view?'page':'false'}" data-active="${m.id===state.view}"><span class="nav-icon" aria-hidden="true">${m.icon}</span><span>${m.title}</span></button>`}).join('')}
function options(field,label,rows){return [{value:'all',label},...[...new Set(rows.map(r=>r[field]).filter(Boolean))].sort().map(value=>({value,label:value}))]}
function select(field,label,choices){return `<label class="sr-only" for="filter-${field}">${esc(label)}</label><select class="filter-select" id="filter-${field}" data-filter="${field}" aria-label="${esc(label)}">${choices.map(c=>`<option value="${esc(c.value)}" ${state.filters[field]===c.value?'selected':''}>${esc(c.label)}</option>`).join('')}</select>`}
function renderFilters(c){const view=state.view;const periodOptions=[...new Set(c.mainRaw.flatMap(r=>r.date?[r.date.slice(0,7)]:[]))].sort().reverse();let s=view==='mitra'?'':select('period','Periode',[{value:'all',label:'Semua periode'},...periodOptions.map(p=>({value:p,label:monthLabel(p)}))]);if(c.mainRaw.some(r=>r.area))s+=select('area',view==='inventory'?'Warehouse':'Area',options('area',view==='inventory'?'Semua warehouse':'Semua area',c.mainRaw));if(view!=='overview'&&c.mainRaw.some(r=>r.channel))s+=select('channel','Channel',options('channel','Semua channel',c.mainRaw));if(['pipeline','mitra','sales','orders'].includes(view)&&c.mainRaw.some(r=>r.pic))s+=select('pic','PIC',options('pic','Semua PIC',c.mainRaw));if(['pipeline','payments','mitra','samples'].includes(view))s+=select('status','Status',options('status','Semua status',c.mainRaw));s+=`<label class="filter-search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" aria-label="Cari data" placeholder="${view==='pipeline'?'Cari lead…':'Cari data…'}" value="${esc(state.filters.search)}"></label><button class="reset" id="resetFilters" ${JSON.stringify(state.filters)===JSON.stringify(emptyFilters)?'hidden':''}>Reset</button>`;$('filterbar').innerHTML=s;}
function columns(){const view=state.view;return view==='pipeline'?['Mitra / lead','Regional','PIC sales','Status lead','Kontak terakhir']:view==='mitra'?['Nama mitra','Regional','Partner','Skema','Status']:view==='inventory'?['SKU','Warehouse','Jenis mutasi','Tanggal','Qty']:view==='samples'?['Penerima','Tanggal','Status konversi','Qty sample']:view==='logistics'?['Penerima / resi','Tujuan','Ekspedisi','Tanggal','Ongkir']:['Mitra / pesanan','Channel / skema','Tanggal','Qty','Nilai',...(view==='payments'?['Status']:[])]}
function cells(r){const view=state.view;const name=`<button class="cell-detail" data-detail="${esc(r.id)}">${esc(r.name)}</button>`;if(view==='pipeline')return [name,esc(r.area),esc(r.pic),statusHtml(r.status),esc(date(r.raw[21])||'—')];if(view==='mitra')return [name,esc(r.area),esc(r.pic),esc(r.scheme),statusHtml(r.status)];if(view==='inventory')return [name,esc(r.area),statusHtml(r.status),esc(r.date||'—'),integer(r.qty)];if(view==='samples')return [name,esc(r.date||'—'),statusHtml(r.status),integer(r.qty)];if(view==='logistics')return [name,esc(r.area),esc(r.channel),esc(r.date||'—'),money(r.value)];return [name,esc(r.channel||r.scheme||'Mitra'),esc(r.date||'Tanpa tanggal'),integer(r.qty),money(view==='payments'?r.net:r.value),...(view==='payments'?[statusHtml(r.status)]:[])]}
function table(c){const rows=[...c.relevantRows].sort((a,b)=>state.sort==='value'?(state.view==='payments'?b.net-a.net:b.value-a.value):(b.date||'').localeCompare(a.date||'')||b.row-a.row);const pages=Math.max(1,Math.ceil(rows.length/8));state.page=Math.min(state.page,pages);const visible=rows.slice((state.page-1)*8,state.page*8);state.detailItems=rows;const cols=columns();return `<section class="glass table-card"><div class="table-headline"><div><h2>${esc(c.tableTitle)}</h2><p class="card-subtitle">${integer(rows.length)} baris · pilih nama untuk detail</p></div>${['overview','sales','marketplace','orders','payments','logistics'].includes(state.view)?`<select class="filter-select" id="sortInput" aria-label="Urutan"><option value="latest" ${state.sort==='latest'?'selected':''}>Terbaru</option><option value="value" ${state.sort==='value'?'selected':''}>Nilai terbesar</option></select>`:''}</div><div class="table-scroll"><table class="data-table"><thead><tr>${cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${visible.length?visible.map(r=>`<tr>${cells(r).map((cell,i)=>`<td class="${i===0?'name-cell':i===4?'money-cell':''}">${cell||'—'}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}">${empty()}</td></tr>`}</tbody></table></div><div class="table-footer"><span>${rows.length?`${(state.page-1)*8+1}–${Math.min(state.page*8,rows.length)} dari ${integer(rows.length)}`:'0 baris'}</span><div class="pager"><button id="prevPage" aria-label="Halaman sebelumnya" ${state.page===1?'disabled':''}>‹</button><span>Halaman ${state.page} / ${pages}</span><button id="nextPage" aria-label="Halaman berikutnya" ${state.page===pages?'disabled':''}>›</button></div></div></section>`}
function inventoryTable(stock){return `<section class="glass table-card inventory-balances"><div class="table-headline"><h2>Saldo per SKU & warehouse</h2><span class="card-tag">${stock.length} kombinasi</span></div><div class="table-scroll"><table class="data-table"><thead><tr>${['SKU','Warehouse','Total masuk','Total keluar','Saldo tercatat'].map(s=>`<th scope="col">${s}</th>`).join('')}</tr></thead><tbody>${stock.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.area)}</td><td>${integer(r.incoming)}</td><td>${integer(r.outgoing)}</td><td class="${r.value<0?'negative':''}">${integer(r.value)}</td></tr>`).join('')}</tbody></table></div><p class="balance-note">Saldo dari seluruh mutasi tercatat sampai akhir bulan pilihan. Saldo awal dan stok fisik mengikuti kelengkapan sumber.</p></section>`}
function renderResults(c){let s='';const errors=dependencies[state.view].filter(k=>state.sources[k]&&state.sources[k].error);if(errors.length)s+=`<div class="error-grid">${errors.map(k=>`<div class="glass error-card" role="alert"><h2>${esc(SOURCES[k].label)}</h2><p>${esc(state.sources[k].error)}</p>${state.sources[k].rows?`<p>Menampilkan data sebelumnya. Terakhir dibaca ${esc(time(state.sources[k].loadedAt))}.</p>`:''}<button class="reset" data-refresh>Coba lagi</button></div>`).join('')}</div>`;if(errors.length&&!c.known)s+='<div class="notice">Data belum lengkap. Grafik hanya memakai sumber yang terbaca; KPI gabungan menunggu seluruh sumber terkait.</div>';
 s+=`<section class="kpi-grid">${c.metrics.map(m=>`<article class="glass kpi"><div class="kpi-header"><span>${esc(m.label)}</span><div class="kpi-icon" aria-hidden="true">${m.icon}</div></div><div class="kpi-value">${m.value===null?'—':esc(typeof m.value==='string'?m.value:m.currency?shortMoney(m.value):integer(m.value))}</div><p class="kpi-note">${esc(m.note)}</p><div class="kpi-line"></div></article>`).join('')}</section>`;
 const q=quality(c.mainRaw);if(q.undated||q.errors||q.fallback)s+=`<div class="notice"><span>ⓘ</span><span>${q.undated?`${integer(q.undated)} baris tanpa tanggal valid: ikut total semua periode, tidak ikut tren/filter bulan. `:''}${q.fallback?`${q.fallback} baris memakai ${state.view==='orders'?'tanggal pemenuhan':'tanggal pembayaran'} saat tanggal utama kosong. `:''}${q.errors?`${q.errors} baris mengandung error formula. `:''}<button data-definitions>Lihat definisi</button></span></div>`;
 s+=`<div class="charts-grid">${card(c.leftTitle,c.leftSub,lineChart(c.chartData,c.chartCurrency),monthLabel(state.filters.period))}${card(c.donutTitle,state.view==='products'?'Enam produk teratas':'Distribusi pilihan saat ini',donut(c.donutData,c.donutCurrency))}</div><div class="charts-grid">${card(c.ranksTitle,'Lima teratas',ranks(c.ranksData,c.ranksCurrency),c.ranksCurrency?'Rupiah':'Jumlah')}${card(c.breakdownTitle,'Lima teratas',ranks(c.breakdownData,c.breakdownCurrency))}</div>`;
 if(state.view==='inventory')s+=inventoryTable(c.stock);s+=table(c);$('dashboard').innerHTML=s;$('dashboard').setAttribute('aria-busy',String(state.busy));
}
function render(full=true){if(!state.all.master_mitra)rebuild();const c=context();if(full){renderNav();renderFilters(c);const menu=menus.find(m=>m.id===state.view);$('heading').textContent=state.view==='overview'?'Dashboard overview':menu.title;$('breadcrumb').textContent=menu.title;}renderResults(c);$('lastUpdate').textContent='Last Update Data: '+time(state.meta.lastUpdateData);$('lastRefresh').textContent='Last refresh: '+(state.meta.lastRefresh?time(state.meta.lastRefresh):'—');$('sourceSummary').textContent=(state.meta.spreadsheetName||'MASTER OPS JAWA GINGER + SALES PERFORMANCE')+' · '+keys.filter(k=>state.sources[k]&&state.sources[k].rows).length+'/'+keys.length+' sumber terbaca';$('refreshButton').disabled=state.busy;$('refreshLabel').textContent=state.busy?'Memperbarui':'Refresh data';$('refreshIcon').classList.toggle('spin',state.busy);$('loading').hidden=!state.busy;$('globalError').hidden=!state.globalError&&!state.meta.metadataWarning;$('globalError').textContent=state.globalError||state.meta.metadataWarning||'';}
// Pembacaan anonim melalui endpoint Apps Script. Data hanya di memori halaman.
async function fetchData() {
 if (state.busy) return;
 state.busy = true; state.globalError = ''; render(false);
 try {
  const endpoint = new URL(window.JG_CONFIG?.webAppUrl || '');
  if (endpoint.origin !== 'https://script.google.com' || !/^\/macros\/s\/[^/]+\/exec$/.test(endpoint.pathname))
   throw new Error('Isi webAppUrl dengan URL deployment Apps Script /exec di config.js.');
  endpoint.searchParams.set('action', 'data');
  endpoint.searchParams.set('_', String(Date.now()));
  const response = await fetch(endpoint.href, {redirect:'follow', credentials:'omit', signal:AbortSignal.timeout(120000)});
  if (!response.ok) throw new Error('Pembacaan webapp gagal: HTTP ' + response.status);
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error('Webapp belum mengirim JSON. Ganti Code.gs dan deploy versi baru. Pastikan akses Anyone.'); }
  if (data.error) throw new Error(data.error);
  if (!data.sources || typeof data.sources !== 'object') throw new Error('Format data webapp tidak sesuai.');
  const sources = {};
  for (const key of keys) {
   const source = data.sources[key];
   sources[key] = source && Array.isArray(source.rows)
    ? {rows:source.rows, loadedAt:source.loadedAt || data.lastRefresh, error:source.error || null}
    : {error:source?.error || 'Tab ' + key + ' tidak dikirim oleh webapp.'};
  }
  state.sources = sources;
  state.meta = {spreadsheetName:data.spreadsheetName, lastUpdateData:data.lastUpdateData,
   lastRefresh:data.lastRefresh, metadataWarning:data.metadataWarning || ''};
  rebuild();
 } catch (error) {
  state.globalError = error.name === 'TimeoutError'
   ? 'Pembacaan melewati 2 menit. Klik Refresh untuk mencoba lagi.'
   : error instanceof TypeError
    ? 'Koneksi webapp gagal. Periksa internet, URL /exec, akses Anyone, dan deployment Code.gs terbaru.'
    : error.message || String(error);
 } finally { state.busy = false; render(true); }
}

function sidebar(open){$('sidebar').classList.toggle('is-open',open);$('sidebarShade').hidden=!open;$('menuToggle').setAttribute('aria-expanded',String(open));if(open)$('sidebar').querySelector('[aria-current="page"]').focus();else $('menuToggle').focus()}
function detail(r){$('detailTitle').textContent=r.name;$('detailSub').textContent=SOURCES[r.source].label+' · Baris '+r.row+' · '+r.dateBasis+': '+(r.date||'Tidak tersedia');$('detailBody').innerHTML=`<dl class="detail-list">${r.raw.map((v,i)=>str(v)?`<div class="detail-item"><dt>${esc(r.headers[i]||'Kolom '+(i+1))}</dt><dd>${/^https:\/\//i.test(str(v))?`<a href="${esc(v)}" target="_blank" rel="noopener">Buka tautan ↗</a>`:esc(v)}</dd></div>`:'').join('')}</dl>`;$('detailDialog').showModal()}
function definitions(){const definitions=[['Last Update Data','Waktu modifikasi file spreadsheet di Google Drive. Last refresh adalah waktu pembacaan dashboard. Keduanya berbeda; kalkulasi ulang formula otomatis dapat berbeda dari waktu modifikasi file.'],['Total penjualan','Setoran mitra sebelum potongan + gross sales marketplace. Nilai order tidak ditambahkan ke omzet.'],['Pembayaran','Menggunakan total invoice. Lunas hanya Done payment; outstanding hanya Sent invoice / Pending payment / Unpaid. Status lain dihitung terpisah.'],['Tanggal','Mitra memakai tanggal laporan, lalu tanggal pembayaran jika tanggal laporan kosong/tidak valid. Order memakai tanggal order, lalu tanggal pemenuhan jika tanggal order kosong/tidak valid. Tanggal di luar 2000–2100 dianggap tidak valid.'],['Data tidak lengkap','Baris tanpa tanggal ikut total semua periode, tetapi tidak ikut grafik atau filter bulan. Angka kosong/error tidak menambah total. Nama yang berupa error formula tidak menjadi record dashboard.'],['Saldo stok','Masuk − keluar sampai akhir bulan pilihan; bukan hasil stock opname. Nama SKU berbeda tidak digabung otomatis. Unit mengikuti kemasan sumber.'],['Mitra & konversi','Mitra aktif mengikuti status master saat ini. Pipeline menampilkan proporsi status Active; bukan konversi cohort. Sample dihitung per baris penerima, nama berulang belum digabung.'],['Filter','Filter berlaku pada sumber yang memiliki nilai kolom terkait. Misalnya pemilihan regional tidak mencakup marketplace yang tidak memiliki regional. Saldo stok mengikuti periode, warehouse, dan pencarian SKU; mutasi mengikuti periode pilihan.']];$('detailTitle').textContent='Sumber & definisi data';$('detailSub').textContent='Data dibaca saat dibuka dan ketika Refresh ditekan.';$('detailBody').innerHTML=`<div class="sources-list">${keys.map(k=>`<div class="glass source-row"><div>${esc(SOURCES[k].label)}<small>${state.sources[k]&&state.sources[k].rows?integer(state.all[k].length)+' baris valid':''}</small></div>${statusHtml(state.sources[k]&&state.sources[k].error?(state.sources[k].rows?'Data lama':'Gagal'):state.sources[k]&&state.sources[k].rows?'Terbaca':'Belum dibaca')}</div>`).join('')}</div><div class="metric-definitions">${definitions.map(([name,description])=>`<p><strong>${name}</strong><br>${description}</p>`).join('')}</div>`;$('detailDialog').showModal()}
$('navigation').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(!button)return;state.view=button.dataset.view;state.filters={...emptyFilters};state.page=1;state.sort='latest';render(true);if(window.innerWidth<768)sidebar(false)});
$('filterbar').addEventListener('change',event=>{const key=event.target.dataset.filter;if(!key)return;state.filters[key]=event.target.value;state.page=1;render(false)});
let searchTimer;
$('filterbar').addEventListener('input',event=>{if(event.target.id!=='searchInput')return;state.filters.search=event.target.value;state.page=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render(false);$('resetFilters').hidden=JSON.stringify(state.filters)===JSON.stringify(emptyFilters)},160)});
$('filterbar').addEventListener('click',event=>{if(event.target.id==='resetFilters'){state.filters={...emptyFilters};state.page=1;render(true)}});
$('dashboard').addEventListener('change',event=>{if(event.target.id==='sortInput'){state.sort=event.target.value;state.page=1;render(false)}});
$('dashboard').addEventListener('pointerover',event=>{if(event.pointerType==='touch')return;const target=event.target.closest('[data-chart-label]');if(target&&!target.contains(event.relatedTarget))showChartTip(target)});
$('dashboard').addEventListener('pointerout',event=>{if(event.pointerType==='touch')return;const target=event.target.closest('[data-chart-label]');if(target&&!target.contains(event.relatedTarget)&&!target.matches(':focus'))hideChartTips()});
$('dashboard').addEventListener('pointerdown',event=>{const target=event.target.closest('[data-chart-label]');if(target)showChartTip(target);else hideChartTips()});
$('dashboard').addEventListener('focusin',event=>showChartTip(event.target.closest('[data-chart-label]')));
$('dashboard').addEventListener('focusout',event=>{if(event.target.closest('[data-chart-label]'))hideChartTips()});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.chart-interactive'))hideChartTips()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideChartTips()});
$('dashboard').addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.detail){const r=state.detailItems.find(r=>r.id===target.dataset.detail);if(r)detail(r);}else if(target.id==='prevPage'){state.page=Math.max(1,state.page-1);render(false)}else if(target.id==='nextPage'){state.page++;render(false)}else if(target.hasAttribute('data-definitions'))definitions();else if(target.hasAttribute('data-refresh'))fetchData();});
$('refreshButton').addEventListener('click',fetchData);$('sourceButton').addEventListener('click',definitions);$('closeDialog').addEventListener('click',()=>$('detailDialog').close());$('menuToggle').addEventListener('click',()=>sidebar(!$('sidebar').classList.contains('is-open')));$('sidebarShade').addEventListener('click',()=>sidebar(false));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('sidebar').classList.contains('is-open'))sidebar(false)});
rebuild();render(true);fetchData();

</script>
